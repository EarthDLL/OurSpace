# 本项目刻意不使用任何 AndroidX / Material / 第三方库，全部只用 Android framework API。
# 因此必须关闭 AndroidX 与 Jetifier，否则构建会把资源重写并引入不存在的依赖。
android.useAndroidX=false
android.enableJetifier=false
# compileSdk 36 比 AGP 8.6.1 官方支持的高一档，这里显式抑制告警。
android.suppressUnsupportedCompileSdk=36

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.nonTransitiveRClass=true

# 这台开发机对「用户目录下的写入」有额外限制：
#  - Kotlin 编译守护进程建不了 %LOCALAPPDATA%\kotlin\daemon 下的临时文件
#    （报 AccessDeniedException / Could not connect to Kotlin compile daemon），
#  - Gradle 自己的 native 库也从 %USERPROFILE%\.gradle 里加载不了
#    （报 Failed to load native library 'native-platform.dll'）。
# 因此改成进程内编译，并把 GRADLE_USER_HOME 指到工程内（见 tools/_ci-build.cmd）。
# 这两条对别的机器没有副作用。
kotlin.compiler.execution.strategy=in-process
